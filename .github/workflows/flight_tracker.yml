name: Flight deal check
on:
  schedule:
    - cron: '0 */12 * * *'
  workflow_dispatch:
concurrency:
  group: flight-deal-tracker
  cancel-in-progress: false
permissions:
  contents: write
jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      SERPAPI_API_KEY: ${{ secrets.SERPAPI_API_KEY }}
      TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
      TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
      DATABASE_URL: sqlite:///data/tracker.db
      DAILY_API_LIMIT: 100
      MONTHLY_API_LIMIT: 200
      MAX_REQUESTS_PER_RUN: 20
      MAX_OUTBOUND_OPTIONS: 2
      DAILY_ALERT_LIMIT: 5
      TARGET_REF: ${{ github.ref_name }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.ref_name }}
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
      - run: pip install -r requirements.txt
      - run: python -m app.main check
      - name: Save persistent price history
        if: always()
        run: |
          if [ -f data/tracker.db ]; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add -f data/tracker.db
            if ! git diff --cached --quiet; then
              git commit -m "Update flight price history"
              git push origin "HEAD:${TARGET_REF}"
            fi
          fi
