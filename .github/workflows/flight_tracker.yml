name: Flight deal check
on:
  schedule:
    - cron: '2-59/5 * * * *'
  workflow_dispatch:
concurrency:
  group: flight-deal-tracker
  cancel-in-progress: false
permissions:
  contents: write
jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      SERPAPI_API_KEY: ${{ secrets.SERPAPI_API_KEY }}
      TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
      TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
      TELEGRAM_DEALS_CHANNEL_ID: ${{ secrets.TELEGRAM_DEALS_CHANNEL_ID }}
      DATABASE_URL: sqlite:///data/tracker.db
      DAILY_API_LIMIT: 100
      MONTHLY_API_LIMIT: 200
      MAX_REQUESTS_PER_RUN: 20
      MAX_OUTBOUND_OPTIONS: 1
      DAILY_ALERT_LIMIT: 5
      TARGET_REF: ${{ github.ref_name }}
    steps:
      - name: Verify credentials
        run: |
          for name in SERPAPI_API_KEY TELEGRAM_BOT_TOKEN TELEGRAM_CHAT_ID; do
            if [ -z "${!name}" ]; then
              echo "Missing required Actions secret: $name"
              exit 1
            fi
          done
      - uses: actions/checkout@v5
        with:
          ref: ${{ github.ref_name }}
      - uses: actions/setup-python@v6
        with:
          python-version: '3.11'
          cache: pip
          cache-dependency-path: requirements-worker.txt
      - run: pip install -r requirements-worker.txt
      - run: python -m app.main scheduled
      - name: Save persistent price history
        if: always()
        run: |
          if [ -f data/tracker.db ]; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add -f data/tracker.db data/routes.yaml
            if ! git diff --cached --quiet; then
              git commit -m "Update flight price history"
              git push origin "HEAD:${TARGET_REF}"
            fi
          fi
